ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    # Coordinate frames
    map_frame: map
    odom_frame: odom_combined
    base_link_frame: base_footprint
    world_frame: odom_combined

    # Wheel odometry input only
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: true
    odom0_queue_size: 10
